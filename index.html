<!doctype html>
<html lang="th" dir="ltr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>602 memories · ม.6/2 GC Gen 14</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://picsum.photos" />
    <!-- UI font (falls back to Inter if Google Sans Flex is unavailable) -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400..700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <!-- Handwriting fonts for the hero word + sticky notes -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400..700&family=Caveat:wght@600&family=Mali:wght@500&family=Ma+Shan+Zheng&family=Yomogi&family=Nanum+Pen+Script&family=Playpen+Sans:wght@400&family=Itim&family=Sriracha&display=swap"
    />
    <!-- Boot screen: painted before any JS runs, removed once the first page renders -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #fff;
        transition:
          opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1),
          visibility 0s linear 0.45s;
      }
      #boot.is-out {
        opacity: 0;
        visibility: hidden;
      }
      #boot .boot-stack {
        position: relative;
        width: 150px;
        height: 187px;
      }
      #boot .boot-card {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 0 0 14px;
        overflow: hidden;
        background: #fff;
        border: 1px solid #e4e8ef;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(19, 25, 34, 0.1);
        animation: boot-shuffle 2.7s cubic-bezier(0.45, 0, 0.2, 1) infinite;
      }
      #boot .boot-card::before {
        content: "";
        flex: 1;
        background: linear-gradient(110deg, #eef1f5 30%, #f7f8fa 50%, #eef1f5 70%) 0 0 / 250% 100%;
        animation: boot-sheen 1.35s linear infinite;
      }
      #boot .boot-card::after {
        content: "";
        height: 8px;
        margin: 0 14px;
        width: 55%;
        border-radius: 99px;
        background: #eef1f5;
      }
      #boot .boot-card:nth-child(2) {
        animation-delay: -0.9s;
      }
      #boot .boot-card:nth-child(3) {
        animation-delay: -1.8s;
      }
      /* each card: top -> slides out and tucks under -> back -> middle -> top */
      @keyframes boot-shuffle {
        0% {
          z-index: 4;
          transform: rotate(-2deg);
        }
        12% {
          z-index: 4;
          transform: translate(82%, -7%) rotate(11deg);
        }
        12.5% {
          z-index: 1;
        }
        26%,
        33.3% {
          z-index: 1;
          transform: translate(-2px, 9px) rotate(-7deg) scale(0.92);
        }
        45%,
        66.6% {
          z-index: 2;
          transform: translate(3px, 4px) rotate(4deg) scale(0.96);
        }
        78%,
        99.9% {
          z-index: 3;
          transform: rotate(-2deg);
        }
        100% {
          z-index: 4;
          transform: rotate(-2deg);
        }
      }
      @keyframes boot-sheen {
        to {
          background-position: -150% 0;
        }
      }
      #boot .boot-label {
        position: absolute;
        top: calc(100% + 34px);
        left: 50%;
        translate: -50% 0;
        white-space: nowrap;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        font:
          500 15px/1.4 "Google Sans Flex",
          Inter,
          "Noto Sans Thai",
          system-ui,
          sans-serif;
        color: #2b313b;
        letter-spacing: -0.01em;
      }
      #boot .boot-bar {
        position: relative;
        width: 120px;
        height: 3px;
        overflow: hidden;
        border-radius: 99px;
        background: #eef1f5;
      }
      #boot .boot-bar::before {
        content: "";
        position: absolute;
        inset: 0;
        width: 45%;
        border-radius: inherit;
        background: linear-gradient(90deg, #82bcff, #2483ff, #ff66f4, #ff3029, #fe7b02);
        animation: boot-bar 1.3s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes boot-bar {
        from {
          transform: translateX(-105%);
        }
        to {
          transform: translateX(230%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-card,
        #boot .boot-card::before,
        #boot .boot-bar::before {
          animation: none;
        }
        #boot .boot-card:nth-child(1) {
          transform: rotate(-7deg) scale(0.92);
        }
        #boot .boot-card:nth-child(2) {
          transform: rotate(4deg) scale(0.96);
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="กำลังโหลด">
      <div style="position: relative">
        <div class="boot-stack" aria-hidden="true">
          <span class="boot-card"></span><span class="boot-card"></span
          ><span class="boot-card"></span>
        </div>
        <div class="boot-label">602 memories<span class="boot-bar"></span></div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
